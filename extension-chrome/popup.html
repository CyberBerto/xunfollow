<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Unfollow Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <div class="header">
      <h1>🐦 X Unfollow</h1>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>

    <!-- Status -->
    <div class="status-card" id="statusCard">
      <div class="status-indicator" id="statusIndicator"></div>
      <div class="status-text" id="statusText">Ready</div>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-value" id="unfollowedCount">0</div>
        <div class="stat-label">Unfollowed</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="failedCount">0</div>
        <div class="stat-label">Failed</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">Total</div>
      </div>
    </div>

    <!-- Current User -->
    <div class="current-user" id="currentUser" style="display: none;">
      <span class="label">Current:</span>
      <span class="username" id="currentUsername">-</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-primary" id="startBtn">
        ▶ Start
      </button>
      <button class="btn btn-secondary" id="pauseBtn" style="display: none;">
        ⏸ Pause
      </button>
      <button class="btn btn-secondary" id="resumeBtn" style="display: none;">
        ▶ Resume
      </button>
      <button class="btn btn-danger" id="stopBtn" style="display: none;">
        ⏹ Stop
      </button>
    </div>

    <!-- Quick Settings -->
    <div class="quick-settings">
      <div class="setting-row">
        <label>Session Limit:</label>
        <input type="number" id="sessionLimit" value="25" min="1" max="100">
      </div>
      <div class="setting-row">
        <label>Delay (sec):</label>
        <input type="number" id="minDelay" value="30" min="10" max="120">
        <span>-</span>
        <input type="number" id="maxDelay" value="60" min="10" max="120">
      </div>
    </div>

    <!-- Activity Log -->
    <div class="log-section">
      <div class="log-header">
        <h3>Activity Log</h3>
        <button class="btn-text" id="clearLogBtn">Clear</button>
      </div>
      <div class="log-container" id="logContainer">
        <div class="log-empty">No activity yet</div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button class="btn-text" id="exportBtn">📥 Export History</button>
      <button class="btn-text" id="helpBtn">❓ Help</button>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close" id="closeSettingsBtn">×</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label>Daily Limit</label>
          <input type="number" id="dailyLimit" value="50" min="1" max="200">
          <small>Maximum unfollows per day</small>
        </div>
        <div class="setting-group">
          <label>Hourly Limit</label>
          <input type="number" id="hourlyLimit" value="30" min="1" max="100">
          <small>Maximum unfollows per hour</small>
        </div>
        <div class="setting-group">
          <label>Session Limit</label>
          <input type="number" id="settingsSessionLimit" value="25" min="1" max="100">
          <small>Maximum unfollows per session</small>
        </div>
        <div class="setting-group">
          <label>Min Delay (seconds)</label>
          <input type="number" id="settingsMinDelay" value="30" min="10" max="120">
        </div>
        <div class="setting-group">
          <label>Max Delay (seconds)</label>
          <input type="number" id="settingsMaxDelay" value="60" min="10" max="180">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" id="saveSettingsBtn">Save</button>
        <button class="btn btn-secondary" id="cancelSettingsBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
